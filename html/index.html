<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duty Status Pill</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="duty-pill-container" class="hidden">
        <div class="duty-pill">
            <div class="status-dot"></div>
            <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z"/>
            </svg>
            <span id="duty-text">SHERIFF ON DUTY</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
