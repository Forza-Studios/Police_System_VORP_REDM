<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Management</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Top-Right Duty Status Pill -->
    <div id="duty-pill-container" class="hidden">
        <div class="duty-pill">
            <div class="status-dot"></div>
            <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z"/>
            </svg>
            <span id="duty-text">SHERIFF ON DUTY</span>
        </div>
    </div>

    <!-- Center/Right Police Target Action Menu Modal -->
    <div id="target-menu-wrapper" class="hidden">
        <div class="menu-modal">
            <div class="menu-header">
                <div class="header-title">
                    <svg class="header-badge" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z"/>
                    </svg>
                    <span>SHERIFF ACTIONS</span>
                </div>
                <button id="close-menu-btn" class="close-btn">&times;</button>
            </div>

            <div class="target-info-card">
                <div class="info-avatar">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="info-details">
                    <span id="target-name" class="target-name-text">Civilian / Suspect</span>
                    <span id="target-status" class="status-badge uncuffed">Uncuffed</span>
                </div>
            </div>

            <div class="action-options">
                <button id="btn-handcuff" class="action-btn primary">
                    <div class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                        </svg>
                    </div>
                    <div class="btn-text">
                        <span id="cuff-action-label" class="title">Handcuff Individual</span>
                        <span class="subtitle">Restrain or release nearby suspect</span>
                    </div>
                </button>

                <button id="btn-show-id" class="action-btn disabled">
                    <div class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3H5c-1.11 0-2 .89-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 16H5V5h14v14zm-7-2h5v-2h-5v2zm0-4h5v-2h-5v2zm-5 4h3v-6H7v6zm1.5-7c.83 0 1.5-.67 1.5-1.5S9.33 7.5 8.5 7.5 7 8.17 7 9s.67 1.5 1.5 1.5z"/>
                        </svg>
                    </div>
                    <div class="btn-text">
                        <span class="title">Show ID</span>
                        <span class="subtitle">Inspect citizen identification</span>
                    </div>
                    <span class="badge-tag">SOON</span>
                </button>

                <button id="btn-put-jail" class="action-btn primary">
                    <div class="btn-icon">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H9V7h2v10zm4 0h-2V7h2v10zm4 0h-2V7h2v10z"/>
                        </svg>
                    </div>
                    <div class="btn-text">
                        <span class="title">Put in Jail</span>
                        <span class="subtitle">Transport suspect to cell</span>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
